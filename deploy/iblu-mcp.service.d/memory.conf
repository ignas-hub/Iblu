# Drop-in for the installed iblu-mcp.service: /etc/systemd/system/iblu-mcp.service.d/memory.conf
#
# 2026-11-07, 20:51-21:19 UTC: the MCP server grew from ~140 MB to 730+ MB in
# 25 minutes. The box has 4 GB and no swap, so everything on it stalled for ten
# minutes (load 80, Claude's calls timed out), and at 21:19 the kernel's OOM
# killer took the server. Nothing in between restarted it.
#
# With a ceiling the same runaway costs a ~3 s restart of IBLU alone:
#   MemoryHigh — above this the kernel reclaims hard from IBLU first (slows it,
#                does not kill it), so the rest of the box keeps breathing.
#   MemoryMax  — hard ceiling; IBLU is killed inside its own cgroup and
#                Restart=on-failure brings it back.
# Sized for a preview: server (~150 MB idle) + headless Chromium (~300 MB).
[Service]
MemoryHigh=800M
MemoryMax=1100M
